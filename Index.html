<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      transition: 0.3s;
    }

    .gallery img:hover {
      opacity: 0.9;
      transform: scale(1.01);
    }
  </style>
</head>
<body>

  

  <section class="gallery">

    <img src="images/strand.jpg" alt="Bild 1">
    <img src="images/berge.jpg" alt="Bild 2">
    <img src="images/stadt.jpg" alt="Bild 3">
    <img src="images/meer.jpg" alt="Bild 4">
    <img src="images/wald.jpg" alt="Bild 5">
    <img src="images/roadtrip.jpg" alt="Bild 6">

  </section>

  

</body>
</html>
